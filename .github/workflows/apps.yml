name: Apps

# Builds the desktop apps (Windows, Linux, macOS) and the phone apps (Android, iOS)
# from the same web build. Each run uploads the installers as downloadable artifacts.
# Store-signed releases come later; see docs/sop/native-apps.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage,rpm
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: macOS
            os: macos-latest
            bundles: dmg,app
            target: universal-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      # Before packaging: the test build replaces the app binary, so the installers must come after it.
      - name: Check every web file is served with its own type
        shell: bash
        run: npm run build && cd src-tauri && cargo test --release
      - name: Build
        shell: bash
        run: npx tauri build --ci --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: happy-pdf-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build web app and copy it into the Android project
        run: npm run build && npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Check the app asks for no internet access
        run: |
          manifest=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "Merged manifest: $manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The Android app must not request the INTERNET permission"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: happy-pdf-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app and copy it into the iOS project
        run: npm run build && npx cap sync ios
      - name: Build for the iOS simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: cd ios/build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/happy-pdf-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: happy-pdf-iOS-simulator
          path: happy-pdf-ios-simulator.zip
          if-no-files-found: error
