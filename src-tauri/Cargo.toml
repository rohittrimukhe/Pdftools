[package]
name = "happy-pdf"
version = "0.1.0"
description = "Happy PDF desktop app: every document tool, free, private, nothing uploaded."
authors = ["Rohit Trimukhe"]
license-file = "../LICENSE"
repository = "https://github.com/rohittrimukhe/Pdftools"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "happy_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
# Same crate the shell uses to pick each file's type; tests/served_types.rs checks the build against it.
tauri-utils = "2.10.2"
